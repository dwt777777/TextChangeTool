<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本转换工具</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f5f6f8;
    color: #222;
    font-size: 17px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.desc {
    color: #666;
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 22px;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    cursor: default;
  }
  .card-head h2 {
    font-size: 1.1rem;
    margin: 0;
  }
  .step-badge {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2563eb;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .count-badge {
    font-size: 0.85rem;
    color: #888;
    font-weight: 500;
  }
  textarea, input[type="text"] {
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  textarea {
    width: 100%;
    min-height: 150px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1.05rem;
    font-family: inherit;
    resize: vertical;
  }
  textarea[readonly] {
    background: #f8f9fb;
    color: #333;
  }
  textarea.flash {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
  }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1.05rem;
    font-family: inherit;
  }
  .product-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .product-row .product-name {
    flex: 2;
    min-width: 140px;
  }
  .product-row .product-amount {
    flex: 1;
    min-width: 110px;
  }
  .add-row-btn {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    padding: 0;
    font-size: 1.6rem;
    line-height: 1;
    border-radius: 8px;
    background: #16a34a;
  }
  .add-row-btn:disabled {
    background: #ddd;
    color: #999;
    border-color: #ddd;
    cursor: not-allowed;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .hint {
    font-size: 0.88rem;
    color: #999;
    margin: 10px 0 0;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: 1.5px solid transparent;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: 500;
    cursor: pointer;
    min-height: 48px;
  }
  button.btn-outline {
    background: #fff;
    color: #2563eb;
    border-color: #2563eb;
  }
  button.btn-warn {
    background: #fff;
    color: #b45309;
    border-color: #f59e0b;
  }
  button.btn-danger {
    background: #fff;
    color: #dc2626;
    border-color: #dc2626;
  }
  button:disabled {
    background: #eee;
    color: #aaa;
    border-color: #eee;
    cursor: not-allowed;
  }
  button:active:not(:disabled) {
    opacity: 0.8;
  }
  #copyHint, #historyCopyHint {
    font-size: 0.95rem;
    color: #16a34a;
    visibility: hidden;
  }
  footer {
    text-align: left;
    color: #777;
    font-size: 0.9rem;
    line-height: 1.6;
    margin-top: 10px;
    padding: 16px 18px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  footer strong {
    color: #333;
  }
  @media (max-width: 480px) {
    .row {
      flex-direction: column;
      align-items: stretch;
    }
    .row button {
      width: 100%;
    }
    #copyHint, #historyCopyHint {
      text-align: center;
    }
  }
</style>
</head>
<body>

<h1>文本转换工具</h1>
<p class="desc">按下面四步操作：填正文 → 填商品信息 → 转换 → 结果自动累积。所有处理都在你的浏览器里完成，不会上传到任何服务器。</p>

<div class="card">
  <label class="card-head" for="inputText">
    <span class="step-badge">1</span>
    <h2 style="display:inline; margin:0;">正文内容</h2>
  </label>
  <textarea id="inputText" placeholder="在这里粘贴或输入正文..."></textarea>
</div>

<div class="card">
  <div class="card-head">
    <span class="step-badge">2</span>
    <h2>商品信息</h2>
  </div>
  <div id="productRows"></div>

  <div class="row">
    <button id="convertBtn" disabled>转换</button>
    <button id="clearBtn" class="btn-danger" type="button">全部清空</button>
  </div>
  <p id="convertHint" class="hint">先填写至少一个商品名，转换按钮才会启用</p>
</div>

<div class="card">
  <label class="card-head" for="outputText">
    <span class="step-badge">3</span>
    <h2 style="display:inline; margin:0;">转换结果</h2>
  </label>
  <textarea id="outputText" readonly placeholder="点击“转换”后，结果会显示在这里"></textarea>
  <div class="row">
    <button id="copyBtn" class="btn-outline" type="button">复制本次结果</button>
    <span id="copyHint">✓ 已复制</span>
  </div>
</div>

<div class="card">
  <div class="card-head">
    <span class="step-badge">4</span>
    <h2>累积结果</h2>
    <span id="historyCount" class="count-badge"></span>
  </div>
  <textarea id="historyOutput" readonly placeholder='每次转换的结果会累积成数组，例如 ["A","B"]'></textarea>
  <div class="row">
    <button id="historyCopyBtn" class="btn-outline" type="button">复制全部结果</button>
    <button id="historyUndoBtn" class="btn-warn" type="button">删除上一条</button>
    <button id="historyClearBtn" class="btn-danger" type="button">清空全部</button>
    <span id="historyCopyHint">✓ 已复制</span>
  </div>
</div>

<footer>
  <p style="margin: 0 0 6px;"><strong>转换规则说明</strong></p>
  <p style="margin: 0 0 4px;">在正文前面加上「[ ]」，里面放商品信息，格式为「商品名&金额」；金额留空时不加 & 符号，只显示商品名。</p>
  <p style="margin: 0 0 4px;">填了多组商品名和金额，用「/」把它们隔开。</p>
  <p style="margin: 4px 0 0;">例如：[商品名&343424/商品名2]正文内容</p>
</footer>

<script>
  const productRows = document.getElementById('productRows');
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const convertBtn = document.getElementById('convertBtn');
  const convertHint = document.getElementById('convertHint');
  const historyOutput = document.getElementById('historyOutput');
  const historyCount = document.getElementById('historyCount');

  let resultHistory = [];

  function flash(el) {
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    clearTimeout(el._flashTimer);
    el._flashTimer = setTimeout(() => el.classList.remove('flash'), 700);
  }

  function renderHistory() {
    historyOutput.value = resultHistory.length ? JSON.stringify(resultHistory) : '';
    historyCount.textContent = resultHistory.length ? ('共 ' + resultHistory.length + ' 条') : '';
  }
  renderHistory();

  function createRow() {
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML =
      '<input type="text" class="product-name" placeholder="商品名（必填）">' +
      '<input type="text" class="product-amount" placeholder="金额（选填）">' +
      '<button type="button" class="add-row-btn" title="再加一行">+</button>';
    return row;
  }

  function addRow() {
    const oldBtn = productRows.querySelector('.add-row-btn');
    if (oldBtn) oldBtn.remove();
    const row = createRow();
    productRows.appendChild(row);
    row.querySelector('.add-row-btn').addEventListener('click', addRow);
    updateState();
  }

  function updateState() {
    const nameInputs = productRows.querySelectorAll('.product-name');
    const names = Array.from(nameInputs).map((el) => el.value.trim());

    const lastName = names[names.length - 1];
    const addBtn = productRows.querySelector('.add-row-btn');
    if (addBtn) addBtn.disabled = !lastName;

    const hasAnyName = names.some((v) => v);
    convertBtn.disabled = !hasAnyName;
    convertHint.style.display = hasAnyName ? 'none' : 'block';
  }

  productRows.addEventListener('input', updateState);

  addRow();

  convertBtn.addEventListener('click', () => {
    const rows = productRows.querySelectorAll('.product-row');
    const groups = [];
    rows.forEach((row) => {
      const name = row.querySelector('.product-name').value.trim();
      if (!name) return;
      const amount = row.querySelector('.product-amount').value.trim();
      groups.push(amount ? name + '&' + amount : name);
    });
    const prefix = groups.length ? '[' + groups.join('/') + ']' : '';
    outputText.value = prefix + inputText.value;
    flash(outputText);

    resultHistory.push(outputText.value);
    renderHistory();
    flash(historyOutput);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    inputText.value = '';
    outputText.value = '';
    productRows.innerHTML = '';
    addRow();
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!outputText.value) return;
    try {
      await navigator.clipboard.writeText(outputText.value);
    } catch (e) {
      outputText.select();
      document.execCommand('copy');
    }
    const hint = document.getElementById('copyHint');
    hint.style.visibility = 'visible';
    setTimeout(() => { hint.style.visibility = 'hidden'; }, 1500);
  });

  document.getElementById('historyCopyBtn').addEventListener('click', async () => {
    if (!resultHistory.length) return;
    try {
      await navigator.clipboard.writeText(historyOutput.value);
    } catch (e) {
      historyOutput.select();
      document.execCommand('copy');
    }
    const hint = document.getElementById('historyCopyHint');
    hint.style.visibility = 'visible';
    setTimeout(() => { hint.style.visibility = 'hidden'; }, 1500);
  });

  document.getElementById('historyUndoBtn').addEventListener('click', () => {
    resultHistory.pop();
    renderHistory();
  });

  document.getElementById('historyClearBtn').addEventListener('click', () => {
    resultHistory = [];
    renderHistory();
  });
</script>

</body>
</html>
