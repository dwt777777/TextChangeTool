<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本转换工具</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f5f6f8;
    color: #222;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }
  p.desc {
    color: #666;
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 0.9rem;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 0.95rem;
    margin-bottom: 10px;
  }
  .extra-fields {
    display: none;
    gap: 10px;
  }
  .extra-fields.active {
    display: block;
  }
  .row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.secondary {
    background: #e5e7eb;
    color: #222;
  }
  button:active {
    opacity: 0.85;
  }
  #copyHint {
    font-size: 0.85rem;
    color: #16a34a;
    margin-left: 8px;
    visibility: hidden;
  }
  footer {
    text-align: center;
    color: #999;
    font-size: 0.8rem;
    margin-top: 30px;
  }
</style>
</head>
<body>

<h1>文本转换工具</h1>
<p class="desc">输入一段文字，选择一个规则，点击"转换"即可得到处理后的结果。所有处理都在你的浏览器里完成，不会上传到任何服务器。</p>

<div class="card">
  <label for="inputText">原始文本</label>
  <textarea id="inputText" placeholder="在这里粘贴或输入文字..."></textarea>

  <label for="ruleSelect" style="margin-top:16px;">转换规则</label>
  <select id="ruleSelect">
    <option value="upper">转为大写</option>
    <option value="lower">转为小写</option>
    <option value="trim">去除首尾空格</option>
    <option value="removeSpaces">去除所有空格</option>
    <option value="replace">查找并替换</option>
    <option value="reverse">反转文本</option>
    <option value="capitalize">每个单词首字母大写</option>
    <option value="dedupeLines">每行去重</option>
  </select>

  <div id="replaceFields" class="extra-fields">
    <label for="findText">查找内容</label>
    <input type="text" id="findText" placeholder="要查找的文字">
    <label for="replaceText">替换为</label>
    <input type="text" id="replaceText" placeholder="替换成的文字">
  </div>

  <div class="row">
    <button id="convertBtn">转换</button>
    <button id="clearBtn" class="secondary" type="button">清空</button>
  </div>
</div>

<div class="card">
  <label for="outputText">转换结果</label>
  <textarea id="outputText" readonly placeholder="转换后的结果会显示在这里"></textarea>
  <div class="row">
    <button id="copyBtn" class="secondary" type="button">复制结果</button>
    <span id="copyHint">已复制</span>
  </div>
</div>

<footer>纯前端小工具 · 无需登录 · 数据仅存在于本地浏览器</footer>

<script>
  const ruleSelect = document.getElementById('ruleSelect');
  const replaceFields = document.getElementById('replaceFields');
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const findText = document.getElementById('findText');
  const replaceText = document.getElementById('replaceText');

  const rules = {
    upper: (text) => text.toUpperCase(),
    lower: (text) => text.toLowerCase(),
    trim: (text) => text.trim(),
    removeSpaces: (text) => text.replace(/\s+/g, ''),
    replace: (text) => {
      const find = findText.value;
      if (!find) return text;
      return text.split(find).join(replaceText.value);
    },
    reverse: (text) => text.split('').reverse().join(''),
    capitalize: (text) => text.replace(/\b\w/g, (c) => c.toUpperCase()),
    dedupeLines: (text) => {
      const seen = new Set();
      return text.split('\n').filter((line) => {
        if (seen.has(line)) return false;
        seen.add(line);
        return true;
      }).join('\n');
    }
  };

  function updateExtraFields() {
    replaceFields.classList.toggle('active', ruleSelect.value === 'replace');
  }

  ruleSelect.addEventListener('change', updateExtraFields);
  updateExtraFields();

  document.getElementById('convertBtn').addEventListener('click', () => {
    const rule = rules[ruleSelect.value];
    outputText.value = rule ? rule(inputText.value) : inputText.value;
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    inputText.value = '';
    outputText.value = '';
    findText.value = '';
    replaceText.value = '';
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!outputText.value) return;
    try {
      await navigator.clipboard.writeText(outputText.value);
    } catch (e) {
      outputText.select();
      document.execCommand('copy');
    }
    const hint = document.getElementById('copyHint');
    hint.style.visibility = 'visible';
    setTimeout(() => { hint.style.visibility = 'hidden'; }, 1500);
  });
</script>

</body>
</html>
