<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本转换工具</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f5f6f8;
    color: #222;
    font-size: 17px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.desc {
    color: #666;
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 22px;
  }
  .card h2 {
    font-size: 1.1rem;
    margin: 0 0 14px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 1rem;
  }
  textarea {
    width: 100%;
    min-height: 150px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1.05rem;
    font-family: inherit;
    resize: vertical;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1.05rem;
    font-family: inherit;
  }
  .product-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .product-row .product-name {
    flex: 2;
    min-width: 140px;
  }
  .product-row .product-amount {
    flex: 1;
    min-width: 110px;
  }
  .add-row-btn {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    padding: 0;
    font-size: 1.6rem;
    line-height: 1;
    border-radius: 8px;
    background: #16a34a;
  }
  .add-row-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 1.05rem;
    cursor: pointer;
    min-height: 48px;
  }
  button.secondary {
    background: #e5e7eb;
    color: #222;
  }
  button:disabled {
    background: #ccc;
    color: #888;
    cursor: not-allowed;
  }
  button:active:not(:disabled) {
    opacity: 0.85;
  }
  #copyHint {
    font-size: 0.95rem;
    color: #16a34a;
    margin-left: 8px;
    align-self: center;
    visibility: hidden;
  }
  footer {
    text-align: center;
    color: #999;
    font-size: 0.85rem;
    margin-top: 30px;
  }
</style>
</head>
<body>

<h1>文本转换工具</h1>
<p class="desc">填写商品名（必填）和金额（选填），再输入正文，点击"转换"即可在正文前拼接上 [商品名:金额] 信息。所有处理都在你的浏览器里完成，不会上传到任何服务器。</p>

<div class="card">
  <h2>商品信息</h2>
  <div id="productRows"></div>
</div>

<div class="card">
  <label for="inputText">正文内容</label>
  <textarea id="inputText" placeholder="在这里粘贴或输入正文..."></textarea>

  <div class="row">
    <button id="convertBtn" disabled>转换</button>
    <button id="clearBtn" class="secondary" type="button">清空</button>
  </div>
</div>

<div class="card">
  <label for="outputText">转换结果</label>
  <textarea id="outputText" readonly placeholder="转换后的结果会显示在这里"></textarea>
  <div class="row">
    <button id="copyBtn" class="secondary" type="button">复制结果</button>
    <span id="copyHint">已复制</span>
  </div>
</div>

<footer>纯前端小工具 · 无需登录 · 数据仅存在于本地浏览器</footer>

<script>
  const productRows = document.getElementById('productRows');
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const convertBtn = document.getElementById('convertBtn');

  function createRow() {
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML =
      '<input type="text" class="product-name" placeholder="商品名（必填）">' +
      '<input type="text" class="product-amount" placeholder="金额（选填）">' +
      '<button type="button" class="add-row-btn" title="再加一行">+</button>';
    return row;
  }

  function addRow() {
    const oldBtn = productRows.querySelector('.add-row-btn');
    if (oldBtn) oldBtn.remove();
    const row = createRow();
    productRows.appendChild(row);
    row.querySelector('.add-row-btn').addEventListener('click', addRow);
    updateState();
  }

  function updateState() {
    const nameInputs = productRows.querySelectorAll('.product-name');
    const names = Array.from(nameInputs).map((el) => el.value.trim());

    const lastName = names[names.length - 1];
    const addBtn = productRows.querySelector('.add-row-btn');
    if (addBtn) addBtn.disabled = !lastName;

    const hasAnyName = names.some((v) => v);
    convertBtn.disabled = !hasAnyName;
  }

  productRows.addEventListener('input', updateState);

  addRow();

  convertBtn.addEventListener('click', () => {
    const rows = productRows.querySelectorAll('.product-row');
    const groups = [];
    rows.forEach((row) => {
      const name = row.querySelector('.product-name').value.trim();
      if (!name) return;
      const amount = row.querySelector('.product-amount').value.trim();
      groups.push(name + ':' + amount);
    });
    const prefix = groups.length ? '[' + groups.join('/') + ']' : '';
    outputText.value = prefix + inputText.value;
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    inputText.value = '';
    outputText.value = '';
    productRows.innerHTML = '';
    addRow();
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!outputText.value) return;
    try {
      await navigator.clipboard.writeText(outputText.value);
    } catch (e) {
      outputText.select();
      document.execCommand('copy');
    }
    const hint = document.getElementById('copyHint');
    hint.style.visibility = 'visible';
    setTimeout(() => { hint.style.visibility = 'hidden'; }, 1500);
  });
</script>

</body>
</html>
